name: workflow_01
# To get a trigger on every push in this repo in any branch
on: 
  push: 
    branches: 
      - dev 
  pull_request:
    branches:
      - main
jobs:
  unit-tests:
    name: Running unit tests
    runs-on: ubuntu-latest    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5.1.0
      - name: Setup Python
        uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: |
          mkdir reports/
          pytest --junitxml=reports/unit-test-results.xml --cov=. --cov-report=xml:reports/coverage.xml --cov-report=term-missing -v
      - name: Upload code coverage report
        uses: actions/upload-artifact@v5.0.0
        with:
          name: unit-test-report  
          path: reports/
  codeql:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest      
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix: 
        language: [ 'python' ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5.1.0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: ${{matrix.language}}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
        with:
          category: 'security'
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest   
    needs: [unit-tests]   
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0  
      - name: Download Coverage Report
        uses: actions/download-artifact@v5.0.0
        with:
          name: unit-test-report
          path: reports/        
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: SonarQube Quality Gate Check
        uses: SonarSource/sonarqube-quality-gate-action@v1.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  