name: workflow_01
# To get a trigger on every push in this repo in any branch
on: 
  push: 
    branches: 
      - dev 
  pull_request:
    branches:
      - main
env:
  ENV_TYPE: DEV
  APP_USER: thinknyx
  APP_PORT: 80  
jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-latest
    steps:
      - name: Step-1
        run: |
          pwd
          ls -ltr
          hostname
      - name: Step -2 - Checkout
        uses: actions/checkout@v5.1.0
      - name: Step-3
        run: |
          echo pwd >> myartifact.txt
          mkdir artifacts
          echo ls -ltr >> artifacts/list.txt
          echo hostname >> hostname.txt
      - name: Upload single file
        uses: actions/upload-artifact@v7.0.0
        with:
          name: single_file
          path: ./myartifact.txt
  job2:
    name: JOB2
    needs: job1
    runs-on: ubuntu-latest
    steps:
       - name: Checking current directory
         run: |
          pwd
          ls -ltr
       - name: Download single file artifact
         uses: actions/download-artifact@v8.0.1
         with:
           name: single_file
       - name: Referring environment variables
         run: |
           echo "[INFO] Running deployment for $ENV_TYPE with user $APP_USER."
           echo "[INFO] Once deployed application is accesible on port $APP_PORT."
       - name: Referring repository secret
         run: |
           echo "[INFO] Application password is ${{secrets.APP_PASSWORD}}"
  job3: 
     name: JOB3
     runs-on: ubuntu-latest
     steps:
       - name: Referring context or in-built variables
         run: |
           echo "[INFO] Triggered by ${{ github.event_name}}"
           echo "[INFO] New changes are added by ${{github.actor}} in ${{github.head_ref}} branch"
           echo "[INFO] Current step is running on ${{ runner.os }}"
           echo "[INFO] Current JOB ID is ${{ job.check_run_id }}."
  staging:
    name: STAGE DEPLOYMENT
    runs-on: ubuntu-latest
    steps:
      - name: Referring Environment Variables
        run:  echo "[INFO] Running deployment using ${{ vars.USER }}."
      - name: Referring Environment Secrets
        run: echo "[INFO] Password for ${{ vars.USER }} is ${{secrets.PASSWORD}}."
    environment:
      name: STAGING
    if: github.head_ref == 'dev' 
  production:
    name: PRODUCTION DEPLOYMENT
    runs-on: ubuntu-latest
    steps:
      - name: Referring Environment Variables
        run:  echo "[INFO] Running deployment using ${{ vars.USER }}."
      - name: Referring Environment Secrets
        run: echo "[INFO] Password for ${{ vars.USER }} is ${{secrets.PASSWORD}}."
    environment:
      name: PRODUCTION
    if: github.head_ref == 'main' 
      
      
      
           
           
           
           
     
