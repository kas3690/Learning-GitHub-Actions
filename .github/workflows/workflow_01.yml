name: workflow_01
# To get a trigger on every push in this repo in any branch
on: push
jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-latest
    steps:
      - name: Running single command in Job1
        run: echo "This is my github workflow"
      - name: Cheking OS release for Github Hosted Runner
        run: cat /etc/os-release
      - name: Calling Sleep
        run: sleep 20
  job2:
    name: JOB2
    runs-on: ubuntu-latest
    steps:
      - name: Checking the hostname for the runner
        run: hostname
      - name: running multiple commands
        run: |
          echo "Hello from KAS"
          echo "Current time is 'date'"
          sleep 20
          
      
    



