name: workflow_01
# To get a trigger on every push in this repo in any branch
on: 
  push: 
    branches: 
    - dev 
  pull_request:
    branches:
      - main
env:
  ENV_TYPE: DEV
  APP_USER: thinknyx
  APP_PORT: 80  
jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-latest
    steps:
      - name: Step-1
        run: |
          pwd
          ls -ltr
          hostname
      - name: Step -2 - Checkout
        uses: actions/checkout@v5.1.0
      - name: Step-3
        run: |
          echo pwd >> myartifact.txt
          mkdir artifacts
          echo ls -ltr >> artifacts/list.txt
          echo hostname >> hostname.txt
      - name: Upload single file
        uses: actions/upload-artifact@v7.0.0
        with:
          name: single_file
          path: ./myartifact.txt
  job2:
    name: JOB2
    needs: job1
    runs-on: ubuntu-latest
    steps:
       - name: Checking current directory
         run: |
          pwd
          ls -ltr
       - name: Download single file artifact
         uses: actions/download-artifact@v8.0.1
         with:
           name: single_file
       - name: Referring environment variables
         run: |
           echo "[INFO] Running deployment for $ENV_TYPE with user $APP_USER."
           echo "[INFO] Once deployed application is accesible on port $APP_PORT."
     
